<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="45%" r="65%">
      <stop offset="0%"   stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
    <radialGradient id="bzG" cx="38%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#6a6a70"/>
      <stop offset="50%"  stop-color="#2a2a32"/>
      <stop offset="100%" stop-color="#0c0c0e"/>
    </radialGradient>
  </defs>

  <!-- Outer bezel -->
  <circle cx="150" cy="150" r="149" fill="url(#bzG)"/>
  <!-- Main face -->
  <circle cx="150" cy="150" r="140" fill="url(#bgG)"/>
  <!-- Bezel inner edge ring -->
  <circle cx="150" cy="150" r="138" fill="none" stroke="#1a1a22" stroke-width="1.5"/>

  <!-- ── SECONDARY INNER CIRCLES ──────────────────────────────── -->
  <!-- Outer decorative ring -->
  <circle cx="150" cy="150" r="106" fill="none" stroke="#2e2e3c" stroke-width="3.5"/>
  <!-- Middle decorative ring -->
  <circle cx="150" cy="150" r="82"  fill="none" stroke="#252530" stroke-width="2.5"/>
  <!-- Inner decorative ring -->
  <circle cx="150" cy="150" r="56"  fill="none" stroke="#1e1e28" stroke-width="2"/>

  <!-- ── FULL ARC TRACK (faint groove, 6pm→3pm clockwise 270°) ── -->
  <!-- M 150,275 → start at 6pm ; large-arc=1, sweep=1 (clockwise) → ends at 3pm (275,150) -->
  <path d="M 150,275 A 125,125 0 1,1 275,150"
        fill="none" stroke="#1c1c26" stroke-width="9" stroke-linecap="round"/>

  <!-- ── REDLINE ZONE ARC (6000–8000 RPM, upper-right area) ─── -->
  <!-- Start at 6000 RPM: θ=292.5° → (197.8, 34.5); end at 8000 RPM → (275, 150) -->
  <!-- small-arc (67.5°<180°), sweep=1 (clockwise) -->
  <!-- Wide glow layer -->
  <path d="M 197.8,34.5 A 125,125 0 0,1 275,150"
        fill="none" stroke="#cc0000" stroke-width="16" stroke-linecap="round" opacity="0.22"/>
  <!-- Core red arc -->
  <path d="M 197.8,34.5 A 125,125 0 0,1 275,150"
        fill="none" stroke="#cc1100" stroke-width="9"  stroke-linecap="round" opacity="0.62"/>
  <!-- Bright inner highlight -->
  <path d="M 197.8,34.5 A 125,125 0 0,1 275,150"
        fill="none" stroke="#ff5500" stroke-width="2"  stroke-linecap="round" opacity="0.48"/>

  <!-- ── MAJOR TICKS ──────────────────────────────────────────── -->
  <!-- 0 RPM   θ=90°   -->
  <line x1="150.0" y1="275.0" x2="150.0" y2="260.0" stroke="#d8d8d8" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 1000 RPM θ=123.75° -->
  <line x1="80.6"  y1="253.9" x2="88.9"  y2="241.5" stroke="#d8d8d8" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 2000 RPM θ=157.5° -->
  <line x1="34.5"  y1="197.8" x2="48.4"  y2="192.1" stroke="#d8d8d8" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 3000 RPM θ=191.25° -->
  <line x1="27.4"  y1="125.6" x2="42.1"  y2="128.5" stroke="#d8d8d8" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 4000 RPM θ=225° -->
  <line x1="61.6"  y1="61.6"  x2="72.2"  y2="72.2"  stroke="#d8d8d8" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 5000 RPM θ=258.75° -->
  <line x1="125.6" y1="27.4"  x2="128.5" y2="42.1"  stroke="#d8d8d8" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 6000 RPM θ=292.5°  ← REDLINE START -->
  <line x1="197.8" y1="34.5"  x2="192.1" y2="48.4"  stroke="#ff4400" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 7000 RPM θ=326.25° REDLINE -->
  <line x1="253.9" y1="80.6"  x2="241.5" y2="88.9"  stroke="#ff4400" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 8000 RPM θ=0°      REDLINE END -->
  <line x1="275.0" y1="150.0" x2="260.0" y2="150.0" stroke="#ff4400" stroke-width="2.6" stroke-linecap="round"/>

  <!-- ── MINOR TICKS ──────────────────────────────────────────── -->
  <line x1="113.7" y1="269.6" x2="115.7" y2="262.9" stroke="#666670" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="53.4"  y1="229.3" x2="58.8"  y2="224.9" stroke="#666670" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="25.6"  y1="162.3" x2="32.6"  y2="161.6" stroke="#666670" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="39.8"  y1="91.1"  x2="45.9"  y2="94.4"  stroke="#666670" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="91.1"  y1="39.8"  x2="94.4"  y2="45.9"  stroke="#666670" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="162.3" y1="25.6"  x2="161.6" y2="32.6"  stroke="#666670" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 6500 RPM minor – redline -->
  <line x1="229.3" y1="53.4"  x2="224.9" y2="58.8"  stroke="#ff4400" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 7500 RPM minor – redline -->
  <line x1="269.6" y1="113.7" x2="262.9" y2="115.7" stroke="#ff4400" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ── LABELS (r=95) ─────────────────────────────────────────── -->
  <text x="150.0" y="245.0" text-anchor="middle" dominant-baseline="central"
        fill="#cccccc" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">0</text>
  <text x="97.2"  y="229.0" text-anchor="middle" dominant-baseline="central"
        fill="#cccccc" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">1</text>
  <text x="62.2"  y="186.4" text-anchor="middle" dominant-baseline="central"
        fill="#cccccc" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">2</text>
  <text x="56.8"  y="131.5" text-anchor="middle" dominant-baseline="central"
        fill="#cccccc" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">3</text>
  <text x="82.8"  y="82.8"  text-anchor="middle" dominant-baseline="central"
        fill="#cccccc" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">4</text>
  <text x="131.5" y="56.8"  text-anchor="middle" dominant-baseline="central"
        fill="#cccccc" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">5</text>
  <!-- Redline labels -->
  <text x="186.4" y="62.2"  text-anchor="middle" dominant-baseline="central"
        fill="#ff4400" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">6</text>
  <text x="229.0" y="97.2"  text-anchor="middle" dominant-baseline="central"
        fill="#ff4400" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">7</text>
  <text x="245.0" y="150.0" text-anchor="middle" dominant-baseline="central"
        fill="#ff4400" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">8</text>

  <!-- Unit label -->
  <text x="150" y="187" text-anchor="middle"
        fill="#666670" font-size="10" font-family="Arial,Helvetica,sans-serif" letter-spacing="1">&#215;1000 rpm</text>

  <!-- ── CENTER HUB ─────────────────────────────────────────────── -->
  <circle cx="150" cy="150" r="18" fill="#0c0c10" stroke="#38383e" stroke-width="1.8"/>
  <circle cx="150" cy="150" r="10" fill="#080810" stroke="#44444c" stroke-width="1.2"/>
  <circle cx="150" cy="150" r="4"  fill="#0a0a12"/>
</svg>
