<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100" viewBox="0 0 300 100">
  <defs>
    <linearGradient id="spdbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e06600"/>
    </linearGradient>
  </defs>

  <!-- Main background -->
  <rect width="300" height="100" rx="4" ry="4" fill="url(#spdbg)"/>

  <!-- Top dark border -->
  <rect x="0" y="0" width="300" height="3" rx="1" ry="1" fill="#a03000" opacity="0.70"/>
  <!-- Bottom dark border -->
  <rect x="0" y="97" width="300" height="3" rx="1" ry="1" fill="#a03000" opacity="0.50"/>

  <!-- Left side accent bar -->
  <rect x="0" y="0" width="4" height="100" fill="#7a2000" opacity="0.50"/>

  <!-- Subtle highlight band at top -->
  <rect x="4" y="3" width="292" height="28" fill="#ffffff" opacity="0.08"/>

  <!-- "SPD" label -->
  <text x="12" y="85" font-family="Arial,Helvetica,sans-serif" font-size="9"
        fill="#7a2000" opacity="0.70" letter-spacing="2" font-weight="bold">SPD</text>
</svg>
