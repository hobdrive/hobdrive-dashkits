<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="45%" r="65%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8e2"/>
    </radialGradient>
    <radialGradient id="bzG" cx="38%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#f0f0ee"/>
      <stop offset="45%"  stop-color="#b0b0ac"/>
      <stop offset="100%" stop-color="#787874"/>
    </radialGradient>
  </defs>

  <!-- Outer bezel -->
  <circle cx="150" cy="150" r="149" fill="url(#bzG)"/>
  <!-- Main face -->
  <circle cx="150" cy="150" r="140" fill="url(#bgG)"/>
  <!-- Bezel inner edge ring -->
  <circle cx="150" cy="150" r="138" fill="none" stroke="#cccccc" stroke-width="1.5"/>

  <!-- ── SECONDARY INNER CIRCLES ──────────────────────────────── -->
  <circle cx="150" cy="150" r="106" fill="none" stroke="#c4c4c0" stroke-width="3.5"/>
  <circle cx="150" cy="150" r="82"  fill="none" stroke="#ccccc8" stroke-width="2.5"/>
  <circle cx="150" cy="150" r="56"  fill="none" stroke="#d4d4d0" stroke-width="2"/>

  <!-- ── FULL ARC TRACK ────────────────────────────────────────── -->
  <path d="M 150,275 A 125,125 0 1,1 275,150"
        fill="none" stroke="#d0d0cc" stroke-width="9" stroke-linecap="round"/>

  <!-- ── REDLINE ZONE ARC (6000–8000 RPM) ─────────────────────── -->
  <!-- Wide glow -->
  <path d="M 197.8,34.5 A 125,125 0 0,1 275,150"
        fill="none" stroke="#cc0000" stroke-width="16" stroke-linecap="round" opacity="0.18"/>
  <!-- Core red arc -->
  <path d="M 197.8,34.5 A 125,125 0 0,1 275,150"
        fill="none" stroke="#bb0000" stroke-width="9"  stroke-linecap="round" opacity="0.55"/>
  <!-- Bright highlight -->
  <path d="M 197.8,34.5 A 125,125 0 0,1 275,150"
        fill="none" stroke="#ff3300" stroke-width="2"  stroke-linecap="round" opacity="0.45"/>

  <!-- ── MAJOR TICKS ──────────────────────────────────────────── -->
  <line x1="150.0" y1="275.0" x2="150.0" y2="260.0" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="80.6"  y1="253.9" x2="88.9"  y2="241.5" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="34.5"  y1="197.8" x2="48.4"  y2="192.1" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="27.4"  y1="125.6" x2="42.1"  y2="128.5" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="61.6"  y1="61.6"  x2="72.2"  y2="72.2"  stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="125.6" y1="27.4"  x2="128.5" y2="42.1"  stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Redline ticks -->
  <line x1="197.8" y1="34.5"  x2="192.1" y2="48.4"  stroke="#cc0000" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="253.9" y1="80.6"  x2="241.5" y2="88.9"  stroke="#cc0000" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="275.0" y1="150.0" x2="260.0" y2="150.0" stroke="#cc0000" stroke-width="2.6" stroke-linecap="round"/>

  <!-- ── MINOR TICKS ──────────────────────────────────────────── -->
  <line x1="113.7" y1="269.6" x2="115.7" y2="262.9" stroke="#999990" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="53.4"  y1="229.3" x2="58.8"  y2="224.9" stroke="#999990" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="25.6"  y1="162.3" x2="32.6"  y2="161.6" stroke="#999990" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="39.8"  y1="91.1"  x2="45.9"  y2="94.4"  stroke="#999990" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="91.1"  y1="39.8"  x2="94.4"  y2="45.9"  stroke="#999990" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="162.3" y1="25.6"  x2="161.6" y2="32.6"  stroke="#999990" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="229.3" y1="53.4"  x2="224.9" y2="58.8"  stroke="#cc0000" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="269.6" y1="113.7" x2="262.9" y2="115.7" stroke="#cc0000" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ── LABELS ─────────────────────────────────────────────────── -->
  <text x="150.0" y="245.0" text-anchor="middle" dominant-baseline="central"
        fill="#111111" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">0</text>
  <text x="97.2"  y="229.0" text-anchor="middle" dominant-baseline="central"
        fill="#111111" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">1</text>
  <text x="62.2"  y="186.4" text-anchor="middle" dominant-baseline="central"
        fill="#111111" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">2</text>
  <text x="56.8"  y="131.5" text-anchor="middle" dominant-baseline="central"
        fill="#111111" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">3</text>
  <text x="82.8"  y="82.8"  text-anchor="middle" dominant-baseline="central"
        fill="#111111" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">4</text>
  <text x="131.5" y="56.8"  text-anchor="middle" dominant-baseline="central"
        fill="#111111" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">5</text>
  <!-- Redline labels -->
  <text x="186.4" y="62.2"  text-anchor="middle" dominant-baseline="central"
        fill="#bb0000" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">6</text>
  <text x="229.0" y="97.2"  text-anchor="middle" dominant-baseline="central"
        fill="#bb0000" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">7</text>
  <text x="245.0" y="150.0" text-anchor="middle" dominant-baseline="central"
        fill="#bb0000" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="bold">8</text>

  <!-- Unit label -->
  <text x="150" y="187" text-anchor="middle"
        fill="#888884" font-size="10" font-family="Arial,Helvetica,sans-serif" letter-spacing="1">&#215;1000 rpm</text>

  <!-- ── CENTER HUB ─────────────────────────────────────────────── -->
  <circle cx="150" cy="150" r="18" fill="#e0e0dc" stroke="#aaaaaa" stroke-width="1.8"/>
  <circle cx="150" cy="150" r="10" fill="#ccccca" stroke="#bbbbbb" stroke-width="1.2"/>
  <circle cx="150" cy="150" r="4"  fill="#b8b8b8"/>
</svg>
