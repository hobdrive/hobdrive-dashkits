<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="45%" r="65%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8e2"/>
    </radialGradient>
    <radialGradient id="bzG" cx="38%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#f0f0ee"/>
      <stop offset="45%"  stop-color="#b0b0ac"/>
      <stop offset="100%" stop-color="#787874"/>
    </radialGradient>
  </defs>

  <!-- Outer bezel -->
  <circle cx="150" cy="150" r="149" fill="url(#bzG)"/>
  <!-- Main face -->
  <circle cx="150" cy="150" r="140" fill="url(#bgG)"/>
  <!-- Bezel inner edge ring -->
  <circle cx="150" cy="150" r="138" fill="none" stroke="#cccccc" stroke-width="1.5"/>

  <!-- ── SECONDARY INNER CIRCLES ──────────────────────────────── -->
  <circle cx="150" cy="150" r="106" fill="none" stroke="#c4c4c0" stroke-width="3.5"/>
  <circle cx="150" cy="150" r="82"  fill="none" stroke="#ccccc8" stroke-width="2.5"/>
  <circle cx="150" cy="150" r="56"  fill="none" stroke="#d4d4d0" stroke-width="2"/>

  <!-- ── FULL ARC TRACK: full 270° orange→red arc, 0–8000 RPM ── -->
  <!-- Outer glow -->
  <path d="M 150,275 A 125,125 0 1,1 275,150"
        fill="none" stroke="#ff4400" stroke-width="16" stroke-linecap="round" opacity="0.15"/>
  <!-- Core arc -->
  <path d="M 150,275 A 125,125 0 1,1 275,150"
        fill="none" stroke="#cc2200" stroke-width="9"  stroke-linecap="round" opacity="0.60"/>
  <!-- Bright highlight -->
  <path d="M 150,275 A 125,125 0 1,1 275,150"
        fill="none" stroke="#ff5500" stroke-width="2"  stroke-linecap="round" opacity="0.48"/>

  <!-- Ticks, labels, unit text and hub are in tach-overlay-light.svg -->
</svg>
