<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="ng" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#ff5500"/>
      <stop offset="40%"  stop-color="#ff3300"/>
      <stop offset="100%" stop-color="#cc2200"/>
    </linearGradient>
  </defs>
  <!-- Needle shaft pointing north from center, with slight taper -->
  <polygon points="150,28 147,150 153,150" fill="url(#ng)"/>
  <!-- Counterweight below center -->
  <polygon points="147,150 146,175 154,175 153,150" fill="#cc2200" opacity="0.7"/>
  <!-- Highlight line -->
  <line x1="150" y1="30" x2="150" y2="148" stroke="#ffaa44" stroke-width="0.8" opacity="0.5"/>
  <!-- Center cap -->
  <circle cx="150" cy="150" r="11" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="4.5" fill="#0a0a0a" stroke="#777" stroke-width="1"/>
</svg>
