<svg xmlns="http://www.w3.org/2000/svg" width="140" height="200" viewBox="0 0 560 800">
  <!-- Local feathered backing; every outer edge remains transparent. -->
  <defs>
    <radialGradient id="surround">
      <stop offset="0" stop-color="#080c10" stop-opacity="0.88"/>
      <stop offset="0.6" stop-color="#080c10" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#080c10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="readings">
      <stop offset="0" stop-color="#080c10" stop-opacity="0.88"/>
      <stop offset="0.6" stop-color="#080c10" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#080c10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="560" height="800" fill="url(#surround)"/>
  <rect width="560" height="240" fill="url(#readings)"/>
  <rect y="560" width="560" height="240" fill="url(#readings)"/>
</svg>
