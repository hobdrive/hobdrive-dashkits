<svg xmlns="http://www.w3.org/2000/svg" width="200" height="400" viewBox="0 0 200 400">
  <!-- Background -->
  <rect width="200" height="400" fill="#0b0b14"/>

  <!-- Outer border -->
  <rect x="0.75" y="0.75" width="198.5" height="398.5"
        fill="none" stroke="#2a2a3c" stroke-width="1.5"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="3" height="400" fill="#00c8e0" opacity="0.30"/>

  <!-- Horizontal dividers at 25 %, 50 %, 75 % -->
  <line x1="3" y1="100" x2="200" y2="100" stroke="#1e1e30" stroke-width="1.5"/>
  <line x1="3" y1="200" x2="200" y2="200" stroke="#1e1e30" stroke-width="1.5"/>
  <line x1="3" y1="300" x2="200" y2="300" stroke="#1e1e30" stroke-width="1.5"/>

  <!-- Subtle row-hover fills (very faint alternating shade) -->
  <rect x="3" y="1"   width="197" height="99"  fill="#ffffff" opacity="0.015"/>
  <rect x="3" y="201" width="197" height="99"  fill="#ffffff" opacity="0.015"/>
</svg>
