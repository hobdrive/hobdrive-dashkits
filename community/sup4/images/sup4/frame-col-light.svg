<svg xmlns="http://www.w3.org/2000/svg" width="200" height="400" viewBox="0 0 200 400">
  <!-- Background -->
  <rect width="200" height="400" fill="#f4f4f0"/>

  <!-- Outer border -->
  <rect x="0.75" y="0.75" width="198.5" height="398.5"
        fill="none" stroke="#c0c0b8" stroke-width="1.5"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="3" height="400" fill="#e06600" opacity="0.60"/>

  <!-- Horizontal dividers -->
  <line x1="3" y1="100" x2="200" y2="100" stroke="#ccccca" stroke-width="1.5"/>
  <line x1="3" y1="200" x2="200" y2="200" stroke="#ccccca" stroke-width="1.5"/>
  <line x1="3" y1="300" x2="200" y2="300" stroke="#ccccca" stroke-width="1.5"/>

  <!-- Subtle alternating row fill -->
  <rect x="3" y="1"   width="197" height="99"  fill="#000000" opacity="0.018"/>
  <rect x="3" y="201" width="197" height="99"  fill="#000000" opacity="0.018"/>
</svg>
